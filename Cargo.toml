[package]
name = "inkstone"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui-component = "=0.7.0"
gpui-base = "=0.7.0"
gpui-kit = "=0.7.0"
unicode-segmentation = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
notify = "=7.0.0"
markdown-parser = { package = "markdown", version = "=1.0.0" }
anyhow = "=1.0.104"
lsp-types = "=0.97.0"
percent-encoding = "=2.3.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[profile.release]
debug = 1

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }

