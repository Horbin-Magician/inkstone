[workspace]
resolver = "3"
members = ["crates/inkstone-core", "crates/inkstone-desktop"]
default-members = ["crates/inkstone-core", "crates/inkstone-desktop"]
exclude = ["vendor/gpui-base", "vendor/gpui-component"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
semver = "=1.0.28"
tempfile = "=3.27.0"
roxmltree = "=0.20.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
inkstone-core = { path = "crates/inkstone-core" }
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui-component = { version = "=0.7.0", features = [
    "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-css",
    "tree-sitter-go", "tree-sitter-html", "tree-sitter-java", "tree-sitter-javascript",
    "tree-sitter-markdown", "tree-sitter-python", "tree-sitter-rust", "tree-sitter-sql",
    "tree-sitter-toml", "tree-sitter-tsx", "tree-sitter-typescript", "tree-sitter-yaml",
] }
gpui-base = "=0.7.0"
gpui-kit = "=0.7.0"
unicode-segmentation = "=1.13.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde-saphyr = "=1.3.0"
granit-parser = "=1.3.0"
notify = "=7.0.0"
markdown-parser = { package = "markdown", version = "=1.0.0" }
anyhow = "=1.0.104"
lsp-types = "=0.97.0"
percent-encoding = "=2.3.2"
regex = "=1.13.1"
chrono = "=0.4.45"
similar = "=2.7.0"
sha2 = "=0.10.9"
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.14"
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"] }
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }

objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
libc = "=0.2.189"
ropey = "=2.0.0-beta.1"

[profile.release]
debug = 1

[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }
