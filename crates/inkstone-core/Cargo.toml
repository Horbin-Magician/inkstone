[package]
name = "inkstone-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["graphics"]
graphics = ["dep:mermaid-rs-renderer", "dep:ratex-layout", "dep:ratex-parser", "dep:ratex-svg", "dep:ratex-types"]

[dependencies]
semver.workspace = true
tempfile.workspace = true
roxmltree.workspace = true
reqwest.workspace = true
unicode-segmentation.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
granit-parser.workspace = true
markdown-parser.workspace = true
anyhow.workspace = true
percent-encoding.workspace = true
regex.workspace = true
chrono.workspace = true
similar.workspace = true
sha2.workspace = true
ratex-parser = { workspace = true, optional = true }
ratex-layout = { workspace = true, optional = true }
ratex-types = { workspace = true, optional = true }
ratex-svg = { workspace = true, optional = true }
mermaid-rs-renderer = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
notify.workspace = true
