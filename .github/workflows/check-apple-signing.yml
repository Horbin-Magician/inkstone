name: Validate Apple signing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Configure Apple distribution credentials
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing required secret: $name"; exit 1; fi
          done
          keychain="$RUNNER_TEMP/inkstone-signing.keychain-db"
          certificate="$RUNNER_TEMP/inkstone-certificate.p12"
          trap 'rm -f "$certificate"' EXIT
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security find-identity -v -p codesigning "$keychain"
          identities=$(security find-identity -v -p codesigning "$keychain")
          if ! printf '%s\n' "$identities" | grep -F -- "\"$APPLE_SIGNING_IDENTITY\"" >/dev/null; then
            echo "::error::The P12 does not contain a valid private-key identity matching APPLE_SIGNING_IDENTITY. Export the Developer ID Application identity with its private key."
            exit 1
          fi
          probe="$RUNNER_TEMP/inkstone-signing-probe"
          cp /usr/bin/true "$probe"
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$probe"
          codesign --verify --strict "$probe"
          xcrun notarytool store-credentials inkstone-release --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$keychain"
          printf 'APPLE_SIGNING_IDENTITY=%s\nAPPLE_NOTARY_PROFILE=inkstone-release\nAPPLE_NOTARY_KEYCHAIN=%s\n' "$APPLE_SIGNING_IDENTITY" "$keychain" >> "$GITHUB_ENV"
      - name: Remove Apple distribution credentials
        if: always()
        shell: bash
        run: |
          security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db"
          if [ -f "$RUNNER_TEMP/inkstone-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/inkstone-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/inkstone-certificate.p12"
