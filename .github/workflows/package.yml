name: Native packages
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      APPLE_CERTIFICATE_P12_BASE64:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_SIGNING_IDENTITY:
        required: true
      APPLE_ID:
        required: true
      APPLE_TEAM_ID:
        required: true
      APPLE_APP_SPECIFIC_PASSWORD:
        required: true
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.target }}
      - run: cargo fmt --all --check
      - run: python -m unittest discover -s packaging -p "test_*.py"
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --version=3.11 -y --no-progress
      - name: Install DMG metadata dependencies
        if: runner.os == 'macOS'
        run: python -m pip install -r packaging/macos/requirements.txt
      - name: Configure Apple distribution credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing required secret: $name"; exit 1; fi
          done
          keychain="$RUNNER_TEMP/inkstone-signing.keychain-db"
          certificate="$RUNNER_TEMP/inkstone-certificate.p12"
          trap 'rm -f "$certificate"' EXIT
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          xcrun notarytool store-credentials inkstone-release --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$keychain"
          printf 'APPLE_SIGNING_IDENTITY=%s\nAPPLE_NOTARY_PROFILE=inkstone-release\nAPPLE_NOTARY_KEYCHAIN=%s\n' "$APPLE_SIGNING_IDENTITY" "$keychain" >> "$GITHUB_ENV"
      - name: Build and package Windows
        if: runner.os == 'Windows'
        run: python packaging/package.py "${{ runner.temp }}/inkstone-package"
      - name: Build, sign and notarize macOS
        if: runner.os == 'macOS'
        run: python packaging/package.py "${{ runner.temp }}/inkstone-package" --signed
      - name: Remove Apple distribution credentials
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db"
          if [ -f "$RUNNER_TEMP/inkstone-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/inkstone-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/inkstone-certificate.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/inkstone-package/*.zip
            ${{ runner.temp }}/inkstone-package/*-setup.exe
            ${{ runner.temp }}/inkstone-package/*.dmg
            ${{ runner.temp }}/inkstone-package/*.tar.gz
            ${{ runner.temp }}/inkstone-package/*.sha256
          if-no-files-found: error
