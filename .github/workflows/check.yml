name: Workspace checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    name: Core without desktop dependencies
    runs-on: ubuntu-latest
    env:
      RATEX_UNICODE_FONT: '/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc#Noto Sans CJK SC'
    steps:
      - uses: actions/checkout@v4
      - name: Install CJK font for outlined formula regression
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
          test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      - name: Install repository-pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo clippy --locked -p inkstone-core --all-targets -- -D warnings
      - run: cargo test --locked -p inkstone-core
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install repository-pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
  vendor:
    name: Vendor regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install repository-pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test current vendor sources with their regression lockfile
        run: python tools/vendor-regression/run.py
